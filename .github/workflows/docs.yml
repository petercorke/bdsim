name: Docs Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    name: build docs and jupyterlite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # jupyterlite-pyodide-kernel is a floor, not an exact pin.  It was pinned to
        # 0.6.1 (Pyodide 0.27.6) while Safari had no WebAssembly JSPI ("stack
        # switching"), which newer Pyodide's run_until_complete() needs: without it
        # the kernel crashed, and the workaround (enableRunUntilComplete: false)
        # made imports fail intermittently.  Safari 27 ships JSPI, and the old
        # Pyodide then misbehaved there (kernel never finished starting).  A browser
        # with no JSPI (Firefox outside a flag, Safari before 27) is now rejected
        # with an explanation, not supported by a pin.
        # Installing jupyterlite-core directly rather than the jupyterlite metapackage.
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,docs]
          pip install build
          pip install jupyterlite-core "jupyterlite-pyodide-kernel>=0.8.7" jupyter-server
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Build local bdsim wheel for JupyterLite
        run: |
          cd docs/lite
          rm -f pypi/*.whl pypi/all.json
          python -m build --wheel --outdir pypi ../..
          python gen_index.py
          echo "Using piplite index:"
          cat pypi/all.json

      - name: Build Sphinx docs
        run: |
          make -C docs html llms

      - name: Prepare notebooks for JupyterLite
        run: |
          mkdir -p docs/lite/files/notebooks docs/lite/files/figs
          find docs/lite/files/notebooks -name '*.ipynb' -delete
          rm -f docs/lite/files/figs/*
          cp docs/notebooks/*.ipynb docs/lite/files/notebooks/
          rm -rf docs/lite/files/notebooks/support
          cp -r docs/notebooks/support docs/lite/files/notebooks/support
          cp docs/figs/*.png docs/figs/*.svg docs/lite/files/figs/

      - name: Build JupyterLite content
        run: |
          cd docs/lite
          jupyter lite build --output-dir ../build/html/lite --contents files --force

      - name: Add the browser capability check to JupyterLite
        # a banner, before the kernel starts, if the browser has no WebAssembly JSPI
        run: python docs/lite/inject_jspi_check.py docs/build/html/lite

      - name: Validate JupyterLite kernel availability
        run: |
          if ! find docs/build/html/lite -type d -iname '*pyodide*kernel*' | grep -q .; then
            echo "ERROR: JupyterLite build does not include a Pyodide kernel extension."
            echo "Expected a directory matching '*pyodide*kernel*' under docs/build/html/lite."
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          touch docs/build/html/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    name: deploy to github pages
    if: github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
