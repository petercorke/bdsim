# Build and publish to PyPI on GitHub release creation or manual trigger.
# Uses OIDC trusted publishing — no stored PyPI token required.
# Pure Python package — a universal wheel suffices; no cibuildwheel needed.
#
# A manual run with dry_run ticked builds the sdist and wheel and smoke-tests the
# wheel, but does not publish to PyPI.  Use it to check the release path.

name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and smoke-test, but do not publish to PyPI"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify_version:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        # Skip check on manual workflow_dispatch runs (no release tag exists)
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version    : $TAG"
          echo "Package version: $PKG"
          [ "$TAG" = "$PKG" ] || { echo "ERROR: tag v$TAG does not match pyproject.toml version $PKG"; exit 1; }

  build:
    name: Build sdist and wheel
    needs: verify_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pipx run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke_test:
    name: Smoke-test wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install wheel (pulls deps from PyPI)
        run: pip install --find-links dist bdsim

      - name: Smoke test
        run: python -c "import bdsim; print('OK', bdsim.__version__)"

      - name: Note a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run. The wheel built and passed the smoke test; nothing is published to PyPI." >> "$GITHUB_STEP_SUMMARY"

  upload_pypi:
    name: Publish to PyPI
    needs: [build, smoke_test]
    # skipped on a dry run; a release event has no inputs, so it always publishes
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
