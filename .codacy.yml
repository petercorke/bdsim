---
exclude_paths:
  # bdedit is a vendored student project we're keeping working but not
  # investing further in (the planned bdweb editor is its replacement).
  # It's PySide6/Qt code that leans heavily on `from X import *`, which
  # dominates the repo's lint noise without being worth cleaning up.
  - "src/bdedit/**"

  # Auto-generated by src/bdsim/bin/stubgen.py: pure type-stub signatures
  # (docstring + bare `...` body) for block factory methods that are
  # actually injected onto BlockDiagram at runtime via the @block/AST
  # discovery mechanism, not implemented here. Static analysis resolves
  # calls like bd.GAIN(...) to these stub bodies -- which have no
  # `return` and mirror the real methods' mutable defaults -- and flags
  # false positives (assignment-from-no-return, mutable-default-argument)
  # against code that never actually runs.
  - "src/bdsim/_blockdiagram_mixin.py"

engines:
  bandit:
    exclude_paths:
      # idiomatic pytest assert usage, not the validation-assert risk
      # Bandit_B101 targets -- see PR description for details.
      - "tests/**"
