[project]
name = "bdsim"
version = "1.4.0"
authors = [{ name = "Peter Corke", email = "rvc@petercorke.com" }]

dependencies = [
    "numpy>=2",
    "scipy",
    "matplotlib",
    "spatialmath-python",
    "ansitable",
    "progress",
]
license = { file = "LICENSE" }

description = "Simulate dynamic systems expressed in block diagram form using Python"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["python", "block diagram", "dynamic simulation"]

[project.urls]
homepage = "https://github.com/petercorke/bdsim"
documentation = "https://petercorke.github.io/bdsim/"
repository = "https://github.com/petercorke/bdsim"

[project.optional-dependencies]

dev = [
    "sympy",
    "pytest",
    "pytest-timeout",
    "coverage",
    "ruff",
    "ipython",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-favicon",
    "sphinxcontrib-jquery",
    "sphinx-copybutton",
    "sphinx-codeautolink",
]

bdedit = ["PySide6", "Pillow"]

jupyter = ["ipywidgets", "ipympl"]


bdweb = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]

all = ["PySide6", "Pillow", "ipywidgets", "ipympl"]

[project.scripts]

bdsim = "bdsim.__main__:main"
bdrun = "bdsim.bin.bdrun:bdrun"
bdtex2icon = "bdedit.tex2icon:main"
bdedit-app = "bdedit.make_app:make_app"
bdedit-associate-windows = "bdedit.associate_bd_windows:main"
bdweb = "bdweb.backend.__main__:main"

[project.gui-scripts]

# ideally this would only happen if [edit] option given
bdedit = "bdedit.bdedit:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdsim", "src/bdedit", "src/bdweb"]
exclude = [
    "src/bdedit/figs/**",
    "src/bdedit/Bdedit Technical Report.pdf",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
extend-exclude = [
    "src/bdsim/_blockdiagram_mixin.py",  # auto-generated by src/bdsim/bin/stubgen.py
    "*.md",  # ruff would reformat code fences in documentation
]

[tool.ruff.lint]
select = ["F"]
ignore = [
    "F403",  # star imports are used deliberately by the block modules
    "F405",  # ...and the names they bring in
    "F841",  # unused local variables, mostly in bdedit: tracked as tech-debt
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = "tests"

[tool.coverage.run]
omit = [
    "src/bdedit/tex2icon.py",
    "src/bdsim/blocks/io.py",
    "src/bdsim/blocks/vision.py",
    "tk_editor/*.py",
    "examples/RVC3/*.py",
]
