[project]
name = "bdsim"
version = "1.4.1"
authors = [{ name = "Peter Corke", email = "rvc@petercorke.com" }]

dependencies = [
    "numpy>=2",
    "scipy",
    "matplotlib",
    "spatialmath-python>=1.1.19",  # isnotebook() knows Colab and JupyterLite; no pre-commit dependency
    "ansitable",
    "progress",
]
license = { file = "LICENSE" }

description = "Simulate dynamic systems expressed in block diagram form using Python"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["python", "block diagram", "dynamic simulation"]

[project.urls]
homepage = "https://github.com/petercorke/bdsim"
documentation = "https://petercorke.github.io/bdsim/"
repository = "https://github.com/petercorke/bdsim"

[project.optional-dependencies]

dev = [
    "sympy",
    "pytest",
    "pytest-timeout",
    "coverage",
    "ruff>=0.17,<0.18",
    "ipython",
    "control>=0.10",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-favicon",
    "sphinxcontrib-jquery",
    "sphinx-copybutton",
    "sphinx-codeautolink",
]

bdedit = ["PySide6", "Pillow"]

jupyter = ["ipywidgets", "ipympl"]

control = ["control>=0.10"]


bdweb = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]

all = ["PySide6", "Pillow", "ipywidgets", "ipympl", "control>=0.10"]

[project.scripts]

bdsim = "bdsim.__main__:main"
bdrun = "bdsim.bin.bdrun:bdrun"
bdtex2icon = "bdedit.tex2icon:main"
bdedit-app = "bdedit.make_app:make_app"
bdedit-associate-windows = "bdedit.associate_bd_windows:main"
bdweb = "bdweb.backend.__main__:main"

[project.gui-scripts]

# ideally this would only happen if [edit] option given
bdedit = "bdedit.bdedit:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdsim", "src/bdedit", "src/bdweb"]
exclude = [
    "src/bdedit/figs/**",
    "src/bdedit/docs/**",
    "src/bdedit/Bdedit Technical Report.pdf",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]
# bdedit's documentation screenshots were 75% of the sdist (6.3 of 8.4 MB) and are
# not needed to build or test the package; keep this in step with the wheel above
exclude = [
    "src/bdedit/figs/**",
    "src/bdedit/docs/**",
    "src/bdedit/Bdedit Technical Report.pdf",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "*.md",  # ruff would reformat code fences in documentation
    "*.ipynb",  # notebooks probe optional imports (e.g. google.colab) on purpose
    "docs/llms_txt.py",  # nosemgrep comments are pinned to exact line numbers
]

[tool.ruff.lint]
select = [
    "F",
    "UP006",  # list[X], not List[X]
    "UP007",  # X | Y, not Union[X, Y]
    "UP045",  # X | None, not Optional[X]
    "UP031",  # f-strings, not percent formatting
    "UP032",  # f-strings, not str.format
]
ignore = [
    "F403",  # star imports are used deliberately by the block modules
    "F405",  # ...and the names they bring in
    "F841",  # unused local variables, mostly in bdedit: tracked as tech-debt
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
# generated by stubgen from a fixed header, so an import can be unused in a given file
"src/bdsim/_*stubs*.py" = ["F401"]
# bdedit modules rely on `from x import *` chains, so an "unused" import is often
# a name that dependent modules use implicitly; auto-removing them breaks those modules.
"src/bdedit/**" = ["F401", "UP031", "UP032"]  # vendored, not being modernised

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = "tests"

[tool.coverage.run]
omit = [
    "src/bdedit/tex2icon.py",
    "src/bdsim/blocks/io.py",
    "src/bdsim/blocks/vision.py",
    "tk_editor/*.py",
    "examples/RVC3/*.py",
]
